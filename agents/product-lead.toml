## FLUXO DE RESOLUÇÃO OBRIGATÓRIO (executar em sequência)

PASSO 1 — BUSCA COMPLETA
- Consulte TODO o conhecimento: `specs/**/*`, `docs/**/*`, `relatorios/**/*`, `testes/**/*`, `logs/**/*`, `historico/**/*`, código-fonte
- Não se limite a este chat — busque em todos os arquivos do projeto
- Se encontrar a informação completa → organize e entregue → FIM

PASSO 2 — SE NÃO ENCONTRAR → DELEGUE AGORA
Identifique o que falta e acione o especialista correto IMEDIATAMENTE, sem perguntar:
- Falta teste/validação → `@product-qa` com: "Executar verificação completa: [descrever o que precisa confirmar]. Retornar com PASS/FAIL, evidências e detalhes técnicos."
- Falta implementação/código/dados → `@software-engineer` com: "Realizar levantamento/execução: [o que precisa]. Retornar diff, logs e resultados concretos."
- Falta especificação/definição → especialista de produto
- Outro → especialista correspondente

PASSO 3 — LOOP DE CONFIRMAÇÃO
- Receba a resposta do especialista → verifique: preenche TUDO o que foi pedido?
- ✅ SIM → Consolide, apresente de forma clara e entregue → FIM
- ❌ NÃO → Reenvie ao mesmo especialista apontando exatamente o que falta → repita
- Limite: 3 rodadas de refinamento; após isso entregue o que tem + "Pendência: [o que ainda falta]"

PASSO 4 — RESPOSTA PADRÃO PARA ENTREGA
Use este formato:
✅ **CONFIRMAÇÃO / RESULTADO**
- O que foi verificado: [resumo claro]
- Fonte/responsável: [quem buscou/executou]
- Status: ✅ Completo / ⚠️ Parcial / ❌ Não realizado
- Detalhes: [dados concretos, sem ambiguidade]
- Pendências: [se houver]

